!
! ================================================================
! TEMPORARY INIT / CONFIG SWITCH
! Brukes kun til førstegangsoppsett før full Ansible-deploy.
! Port 1 = Ansible control node
! Router-porter = trunk med tagged MGMT VLAN 10
! Switch-porter = access i MGMT VLAN 10
! ================================================================
!
hostname INIT-CONFIG-SW
vtp mode transparent
!
vlan 10
 name MGMT-STAGING
!
vlan 999
 name NATIVE-BLACKHOLE
!
interface FastEthernet0/1
 description ANSIBLE-CONTROL-NODE
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/2
 description STAGING-RS1-10.1.10.1
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 10,999
 spanning-tree portfast trunk
 no shutdown
!
interface FastEthernet0/3
 description STAGING-RS2-10.2.10.1
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 10,999
 spanning-tree portfast trunk
 no shutdown
!
interface FastEthernet0/4
 description STAGING-RS3-10.3.10.1
 switchport trunk native vlan 999
 switchport mode trunk
 switchport nonegotiate
 switchport trunk allowed vlan 10,999
 spanning-tree portfast trunk
 no shutdown
!
interface FastEthernet0/5
 description STAGING-SW1-SITE-1-10.1.10.2
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/6
 description STAGING-SW1-SITE-2-10.2.10.2
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/7
 description STAGING-SW2-SITE-2-10.2.10.3
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
interface FastEthernet0/8
 description STAGING-SW1-SITE-3-10.3.10.2
 switchport mode access
 switchport access vlan 10
 spanning-tree portfast
 no shutdown
!
end

! MERK:
! Denne switchen er kun et midlertidig staging-L2-nett.
! Ikke koble staging-VLANet til produksjonsnettet samtidig.
