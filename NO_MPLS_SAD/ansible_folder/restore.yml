---
- name: Restore pre-change configuration
  hosts: cisco
  gather_facts: false

  tasks:
    - name: Replace running-config with pre-change backup
      cisco.ios.ios_command:
        commands:
          - "configure replace flash:/ansible-restore.cfg force"

    - name: Save restored configuration
      cisco.ios.ios_command:
        commands:
          - "write memory"
