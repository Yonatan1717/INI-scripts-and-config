---
- name: Deploy Loopback99 test change
  hosts: cisco
  gather_facts: false

  tasks:
    - name: Create Loopback99
      cisco.ios.ios_config:
        parents:
          - interface Loopback99
        lines:
          - description ANSIBLE-SAFE-CHANGE-TEST
          - ip address 192.0.2.99 255.255.255.255
