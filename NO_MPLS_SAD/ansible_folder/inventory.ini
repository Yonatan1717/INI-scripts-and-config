[cisco_routers]
RS1 ansible_host=10.1.10.1 config_file="ansibleConfigs/site_1/RS1.cfg" bootstrap_config_file="ansibleBootstrapConfigs/site_1/RS1_SSH_SCP.cfg"
RS2 ansible_host=10.2.10.1 config_file="ansibleConfigs/site_2/RS2.cfg" bootstrap_config_file="ansibleBootstrapConfigs/site_2/RS2_SSH_SCP.cfg"
RS3 ansible_host=10.3.10.1 config_file="ansibleConfigs/site_3/RS3.cfg" bootstrap_config_file="ansibleBootstrapConfigs/site_3/RS3_SSH_SCP.cfg"

[cisco_switches]
SW1-SITE-1 ansible_host=10.1.10.2 config_file="ansibleConfigs/site_1/SW1-SITE-1.cfg" bootstrap_config_file="ansibleBootstrapConfigs/site_1/SW1-SITE-1_SSH_SCP.cfg"
SW1-SITE-2 ansible_host=10.2.10.2 config_file="ansibleConfigs/site_2/SW1-SITE-2.cfg" bootstrap_config_file="ansibleBootstrapConfigs/site_2/SW1-SITE-2_SSH_SCP.cfg"
SW2-SITE-2 ansible_host=10.2.10.3 config_file="ansibleConfigs/site_2/SW2-SITE-2.cfg" bootstrap_config_file="ansibleBootstrapConfigs/site_2/SW2-SITE-2_SSH_SCP.cfg"
SW1-SITE-3 ansible_host=10.3.10.2 config_file="ansibleConfigs/site_3/SW1-SITE-3.cfg" bootstrap_config_file="ansibleBootstrapConfigs/site_3/SW1-SITE-3_SSH_SCP.cfg"

[cisco:children]
cisco_routers
cisco_switches

[cisco:vars]
ansible_connection=ansible.netcommon.network_cli
ansible_network_os=cisco.ios.ios
ansible_user=admin
ansible_password=bani
ansible_network_cli_ssh_type=libssh
ansible_host_key_checking=False
ansible_libssh_config_file="{{ inventory_dir }}/legacy_ssh.cfg"
ansible_libssh_key_exchange_algorithms=+diffie-hellman-group14-sha1
ansible_libssh_hostkeys=ssh-rsa
