---
- name: Verify restored configuration
  hosts: cisco
  gather_facts: false

  tasks:
    - name: Verify device is reachable after restore
      cisco.ios.ios_facts:
        gather_subset:
          - min

    - name: Compare restored file with running-config
      cisco.ios.ios_command:
        commands:
          - "show archive config differences flash:/ansible-restore.cfg system:running-config"
      register: config_diff

    - name: Show configuration diff
      ansible.builtin.debug:
        var: config_diff.stdout[0]

    - name: Verify no configuration differences remain
      ansible.builtin.assert:
        that:
          - "(config_diff.stdout[0] | regex_search('(?m)^[+-]')) is none"
        success_msg: "Restore verified successfully on {{ inventory_hostname }}"
        fail_msg: "Restore verification failed on {{ inventory_hostname }} - config differences remain"
